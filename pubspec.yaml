name: iclick
description: "ConnectMe — Share. Discover. Connect. A modern community social platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0

  # Device & Native
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  device_info_plus: ^11.2.0
  google_maps_flutter: ^2.10.0

  # Utilities
  uuid: ^4.5.1
  timeago: ^3.7.0

  # Splash
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  icons_launcher: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/nav_bar/

flutter_native_splash:
  background_image: assets/images/background.png
  image: assets/images/image.png
  fullscreen: true

icons_launcher:
  image_path: "assets/images/logo.jpg"
  platforms:
    android:
      enable: true
      image_path: "assets/images/logo.jpg"
      notification_image: "assets/images/logo.jpg"
